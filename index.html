<!DOCTYPE>
<html>
  <body>
    <h1>DES Y3 Multi-Resolution Mass Map</h1>
    <script type="text/javascript" src="https://code.jquery.com/jquery-1.9.1.min.js" charset="utf-8"></script>

    <div id="aladin-lite-div" style="width:700px;height:400px;"></div>
    
    <script type="text/javascript" src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
    
    <script type="text/javascript">
        A.init.then(() => {
            const myHiPS = 'https://kylemiller1.github.io/Mass-Maps/Wiener4_hips_masked/';

            let aladin = A.aladin('#aladin-lite-div', {
                survey: 'P/2MASS/color',  
                name: 'DES Wiener Tomographic Bin 4 Mass Map',
                target: '13h00m00s -55d00m00s',  
                fov: 40,  
                showReticle: true,
                showGotoControl: true,
                showLayersControl: true,
                showZoomControl: true,
                showFullscreenControl: true,
                opacity: 0.98
            });
          
            aladin.setProjection("MOL");
      
			aladin.setOverlayImageLayer(aladin.newImageSurvey(myHiPS, {opacity: 0.99}), 'layer')
          
            aladin.setOverlayImageLayer(
              A.image(
                  "https://kylemiller1.github.io/Mass-Maps/Patches/patch_64_tom4.jpg",
                  {
                      name: "patch_64",
                      imgFormat: 'jpeg',
                      wcs: {
                          WCSAXES: 2, // Number of coordinate axes                      
                          CRPIX1: 128.0, // Pixel coordinate of reference point            
                          CRPIX2: 128.0, // Pixel coordinate of reference point            
                          CDELT1: 0.016666666666667, // [deg] Coordinate increment at reference point  
                          CDELT2: 0.016666666666667, // [deg] Coordinate increment at reference point  
                          CUNIT1: 'deg', // Units of coordinate increment and value        
                          CUNIT2: 'deg', // Units of coordinate increment and value        
                          CTYPE1: 'RA---TAN', // Right ascension, gnomonic projection           
                          CTYPE2: 'DEC--TAN', // Declination, gnomonic projection               
                          CRVAL1: 343.51376271573, // [deg] Coordinate value at reference point      
                          CRVAL2: -53.456667, //-53.306666666667, // [deg] Coordinate value at reference point      
                          LONPOLE: 180.0, // [deg] Native longitude of celestial pole       
                          LATPOLE: -53.306666666667, // [deg] Native latitude of celestial pole        
                          MJDREF: 0.0, // [d] MJD of fiducial time                       
                          RADESYS: 'ICRS', // Equatorial coordinate system 
                          NAXIS1: 256,
                          NAXIS2: 256,
                          EQUINOX: 2000.0

                      },
                      successCallback: (ra, dec, fov, image) => {
                          aladin.gotoRaDec(ra, dec);
                          aladin.setFoV(fov*15);
                      }
                  }
              )
            );
        });
    </script>
      
  </body>
</html>
